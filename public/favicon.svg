<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#131a26" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="stethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#stethGrad)" stroke-width="6" opacity="0.2" />

  <!-- Stethoscope Vector Icon -->
  <g filter="url(#glow)">
    <!-- Earpieces Top -->
    <circle cx="176" cy="128" r="16" fill="#38bdf8" />
    <circle cx="336" cy="128" r="16" fill="#38bdf8" />

    <!-- Ear Tubes -->
    <path d="M 176 144 L 176 200 C 176 240, 220 256, 256 256 C 292 256, 336 240, 336 200 L 336 144" 
          fill="none" stroke="url(#stethGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Main Tubing down -->
    <path d="M 256 256 L 256 340 C 256 390, 310 400, 330 370 C 345 345, 315 320, 290 340" 
          fill="none" stroke="url(#stethGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Chestpiece / Diaphragm -->
    <circle cx="336" cy="352" r="38" fill="#0a0e17" stroke="url(#stethGrad)" stroke-width="16" />
    <circle cx="336" cy="352" r="14" fill="#10b981" />
  </g>
</svg>
